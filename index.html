<script>
/* Auth lives in sessionStorage, which is scoped to a single tab — so every new
   tab (or window) has to sign in again. It also expires 1 hour after sign-in,
   re-checked every minute so a long-idle tab is signed out too. */
(function(){
  var MAX=3600000;
  function bounce(){
    try{sessionStorage.removeItem('cmr_auth');sessionStorage.removeItem('cmr_auth_at');}catch(e){}
    location.replace('login.html?next='+encodeURIComponent(location.pathname+location.search));
  }
  function ok(){
    var a,t;try{a=sessionStorage.getItem('cmr_auth');t=+sessionStorage.getItem('cmr_auth_at')||0;}catch(e){return false;}
    return a==='1'&&t>0&&(Date.now()-t)<MAX;
  }
  if(!ok())bounce();
  else setInterval(function(){if(!ok())bounce();},60000);
})();
</script>

<script>
'use strict';
const $=id=>document.getElementById(id);
const states=STATE_ORDER.filter(s=>RESORTS.some(r=>r.state===s));
$('stResorts').textContent=RESORTS.length;
$('stStates').textContent=states.length;

/* ═══════════ custom dropdown (replaces native <select>) ═══════════
   Native <select> popups are sized/positioned by the browser/OS, not
   by our CSS — on some laptops/phones that popup gets clipped by the
   viewport. This version is our own floating panel: it always fits
   the screen (it measures available space and flips above/below,
   caps its own height, and scrolls internally). ═══════════ */
function makeCustomSelect({trigger,valueEl,panel,placeholder,onChange}){
  let groups=[], flatOptions=[], activeIndex=-1, selectedValue='';

  function render(){
    panel.innerHTML='';
    flatOptions=[];
    if(!groups.some(([,items])=>items.length)){
      const e=document.createElement('div');e.className='csel-empty';e.textContent='Nothing to choose yet';
      panel.appendChild(e);return;
    }
    for(const [label,items] of groups){
      if(!items.length)continue;
      if(label){
        const g=document.createElement('div');g.className='csel-group';g.textContent=label;
        panel.appendChild(g);
      }
      for(const item of items){
        const o=document.createElement('div');
        o.className='csel-opt';o.setAttribute('role','option');
        o.id=panel.id+'-opt-'+flatOptions.length;
        o.textContent=item.label;
        if(item.value===selectedValue)o.classList.add('selected');
        panel.appendChild(o);
        flatOptions.push({...item,el:o});
      }
    }
  }
  function setGroups(g){groups=g;render();}
  function positionPanel(){
    panel.style.top='';panel.style.bottom='';panel.style.maxHeight='';panel.style.marginTop='';panel.style.marginBottom='';
    const rect=trigger.getBoundingClientRect();
    const spaceBelow=window.innerHeight-rect.bottom-12, spaceAbove=rect.top-12;
    if(spaceBelow>=180||spaceBelow>=spaceAbove){
      panel.style.top='100%';panel.style.marginTop='6px';
      panel.style.maxHeight=Math.max(140,Math.min(360,spaceBelow))+'px';
    }else{
      panel.style.bottom='100%';panel.style.marginBottom='6px';
      panel.style.maxHeight=Math.max(140,Math.min(360,spaceAbove))+'px';
    }
  }
  function setActive(i){
    if(activeIndex>=0&&flatOptions[activeIndex])flatOptions[activeIndex].el.classList.remove('active');
    activeIndex=i;
    const o=flatOptions[activeIndex];
    if(o){o.el.classList.add('active');o.el.scrollIntoView({block:'nearest'});panel.setAttribute('aria-activedescendant',o.el.id);}
  }
  function onDocClick(e){if(!trigger.contains(e.target)&&!panel.contains(e.target))close();}
  function onKeydown(e){
    if(e.key==='Escape'){close();trigger.focus();}
    else if(e.key==='ArrowDown'){e.preventDefault();setActive(Math.min(flatOptions.length-1,activeIndex+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setActive(Math.max(0,activeIndex-1));}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(activeIndex>=0)selectIndex(activeIndex);}
    else if(e.key==='Home'){e.preventDefault();setActive(0);}
    else if(e.key==='End'){e.preventDefault();setActive(flatOptions.length-1);}
  }
  function open(){
    if(trigger.disabled||!flatOptions.length)return;
    panel.classList.add('open');trigger.setAttribute('aria-expanded','true');
    positionPanel();
    const idx=flatOptions.findIndex(o=>o.value===selectedValue);
    setActive(idx>=0?idx:0);
    document.addEventListener('click',onDocClick);
    document.addEventListener('keydown',onKeydown);
  }
  function close(){
    panel.classList.remove('open');trigger.setAttribute('aria-expanded','false');
    document.removeEventListener('click',onDocClick);
    document.removeEventListener('keydown',onKeydown);
  }
  function selectIndex(i){
    const o=flatOptions[i];if(!o)return;
    selectedValue=o.value;
    valueEl.textContent=o.label;valueEl.classList.remove('placeholder');
    flatOptions.forEach(x=>x.el.classList.remove('selected'));o.el.classList.add('selected');
    close();trigger.focus();
    onChange(o.value,o);
  }
  panel.addEventListener('click',e=>{
    const o=e.target.closest('.csel-opt');if(!o)return;
    const idx=flatOptions.findIndex(x=>x.el===o);if(idx>=0)selectIndex(idx);
  });
  trigger.addEventListener('click',()=>{panel.classList.contains('open')?close():open();});
  window.addEventListener('resize',()=>{if(panel.classList.contains('open'))positionPanel();});

  return {
    setGroups,
    reset(ph){
      selectedValue='';valueEl.textContent=ph||placeholder;valueEl.classList.add('placeholder');
      flatOptions.forEach(x=>x.el.classList.remove('selected'));
    },
    setDisabled(d){trigger.disabled=d;},
    get value(){return selectedValue;}
  };
}

/* state dropdown — India only */
const stateSelect=makeCustomSelect({
  trigger:$('stateTrigger'),valueEl:$('stateValue'),panel:$('statePanel'),
  placeholder:'Choose a state…',
  onChange:st=>{
    resortSelect.reset('First choose a state…');
    resortSelect.setDisabled(false);
    btn.classList.remove('show');note.textContent='';
    const items=RESORTS.filter(r=>r.state===st).map(r=>({value:r.id,label:r.name+((r.page||r.mapped)?'  · full map':'')}));
    resortSelect.setGroups([[null,items]]);
    resortSelect.reset('Choose a resort…');
  }
});
const stateItems=states.map(s=>({value:s,label:`${s} (${RESORTS.filter(r=>r.state===s).length})`}));
stateSelect.setGroups([[null,stateItems]]);

const btn=$('openBtn'), note=$('mapnote');
const resortSelect=makeCustomSelect({
  trigger:$('resortTrigger'),valueEl:$('resortValue'),panel:$('resortPanel'),
  placeholder:'Choose a resort…',
  onChange:id=>{
    const r=RESORTS.find(x=>x.id===id);
    btn.classList.add('show');
    note.textContent=(r.page||r.mapped)?'Opens the full interactive walking map':'Opens our resort map (detailed layout being prepared)';
  }
});
resortSelect.setDisabled(true);

function urlFor(id){
  return 'map.html?id='+encodeURIComponent(id);
}
btn.addEventListener('click',()=>{if(resortSelect.value)location.href=urlFor(resortSelect.value);});

/* ═══════════ SARII — voice on the dashboard ═══════════
   Here she only needs to open a resort; all the wayfinding talk lives on the map. */
const vnorm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function findResort(text){
  const q=vnorm(text); if(q.length<3)return null;
  let best=null,sc=0;
  for(const r of RESORTS){
    const n=vnorm(r.name);
    const short=n.replace(/^club mahindra\s*/,'');
    let s=0;
    if(q.includes(short)&&short.length>3)s=80+short.length;
    else{
      const words=short.split(' ').filter(w=>w.length>3);
      const hit=words.filter(w=>q.includes(w)).length;
      if(hit)s=30+hit*15;
    }
    if(s>sc){sc=s;best=r;}
  }
  return sc>=45?best:null;
}
function statesOf(text){
  const q=vnorm(text);
  return states.filter(s=>q.includes(vnorm(s)));
}
/* what she can answer on the dashboard */
const HOME_QA=[
 {re:/\b(hello|hi|hey|namaste|good (morning|afternoon|evening|night))\b/,
  a:()=>'Hello! Which resort would you like to see?'},
 {re:/\b(your name|who are you|what are you|about you|who made you)\b/,
  a:()=>'My name is Siri. I can help you find any Club Mahindra resort and show you its map.'},
 {re:/\b(thank|thanks|shukriya)\b/, a:()=>'Happy to help.'},
 {re:/\b(bye|goodbye|see you)\b/, a:()=>'Goodbye, and enjoy your holiday.'},
 {re:/\bwhat.*\btime\b|\btime (is it|now)\b/,
  a:()=>'It is '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'.'},
 {re:/\b(what|which)\b.*\b(day|date)\b|\btoday\b/,
  a:()=>'Today is '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.'},
 {re:/\bhow many\b.*\bresort/, a:()=>`There are ${RESORTS.length} resorts across ${states.length} states.`},
 {re:/\bhow many\b.*\bstate/, a:()=>`We cover ${states.length} states across India.`},
 {re:/\b(which|what|list|name).*(state|place|location)s?\b/,
  a:()=>'We have resorts in '+states.slice(0,8).join(', ')+', and more. Say a state name to hear its resorts.'},
 {re:/\b(full map|interactive|detailed map|which resort.*map)\b/,
  a:()=>{const m=RESORTS.filter(r=>r.page||r.mapped).map(r=>r.name.replace(/^Club Mahindra\s*/,''));
    return m.length?'Full interactive maps are ready for '+m.join(', ')+'. More are being added.'
                   :'Interactive maps are being prepared.';}},
 {re:/\b(help|what can you do|what can i say|commands|options)\b/,
  a:()=>'Say the name of a resort to open its map — for example, open Tungi. '
       +'You can also ask which states we cover, or how many resorts there are.'},
 {re:/\b(login|log ?out|sign ?out|password|account)\b/,
  a:()=>'Your sign in lasts for one hour. After that the app will ask you to sign in again.'},
 {re:/\b(weather|rain|temperature)\b/,
  a:()=>'I do not have live weather information here.'},
];
/* A bare greeting wakes her up; a longer phrase just loses the wake word. */
const WAKE=/^(h+i+|h+e+y+|h+e+l+o+|h+e+l+l+o+|hmm+|hm+|mm+|yo|siri|hi siri|hey siri|hello siri|ok siri|okay siri|excuse me|are you there|you there|listen)[\s!.?,]*$/;
const WAKE_PREFIX=/^\s*(ok(ay)?\s+|hey\s+|hi\s+|hello\s+)?siri[\s,.!]*/i;
const WAKE_REPLIES=['Hi! How can I help you?','Hello! How can I help you?','Yes? How can I help you?'];

function siriHome(said,alts){
  let all=(alts&&alts.length?alts:[said]);
  all=all.map(a=>String(a).replace(WAKE_PREFIX,'').trim()||String(a));
  said=all[0];
  const any=re=>all.some(a=>re.test(vnorm(a)));

  if(all.some(a=>WAKE.test(vnorm(a)))){
    Siri.speak(WAKE_REPLIES[Math.floor(Math.random()*WAKE_REPLIES.length)]);
    return true;
  }

  /* open a resort by name — the main job on this page */
  let r=null;
  for(const a of all){ r=findResort(a); if(r)break; }
  if(r&&any(/\b(open|show|take me|go to|map|resort|visit|navigate)\b/)){
    Siri.speak(`Opening ${r.name}.`);
    setTimeout(()=>{location.href=urlFor(r.id);},1200);
    return true;
  }

  /* "resorts in Goa" → read them out */
  const st=statesOf(said);
  if(st.length){
    const list=RESORTS.filter(x=>x.state===st[0]).map(x=>x.name.replace(/^Club Mahindra\s*/,''));
    Siri.speak(`In ${st[0]} we have ${list.length} resort${list.length===1?'':'s'}: `
      +list.slice(0,6).join(', ')+'. Say a resort name to open its map.');
    return true;
  }

  for(const item of HOME_QA){
    if(item.re.test(vnorm(said))){ const ans=item.a(); if(ans){ Siri.speak(ans); return true; } }
  }

  if(r){    // a bare resort name still means "open it"
    Siri.speak(`Opening ${r.name}.`);
    setTimeout(()=>{location.href=urlFor(r.id);},1200);
    return true;
  }
  return false;
}
if(window.Siri){
  // No welcome here: the sign-in page already said it out loud, inside the click
  // gesture where audio is reliably allowed. Siri carries an "already greeted"
  // mark for the whole tab, so this line is only ever reached by a guest who
  // switches her on having somehow missed it.
  Siri.configure({
    welcome:'Welcome to Club Mahindra Resorts. My name is Siri. How can I help you?',
    hint:'Sorry, I did not catch that. Say the name of a resort, or say help.',
    onCommand:siriHome
  });
  Siri.mountToggle('voiceToggleHost','Ask Siri');
}
</script>
